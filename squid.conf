# squid.conf
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- DOMAIN ALLOWLIST ---
# Allow Anthropic (Claude)
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .claude.ai

# Allow Google (Gemini)
acl allowed_domains dstdomain .googleapis.com
acl allowed_domains dstdomain .google.com
acl allowed_domains dstdomain .gstatic.com

# Allow NPM/Playwright
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .playwright.dev
acl allowed_domains dstdomain .microsoft.com
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .pnpm.io

http_access allow allowed_domains

# --- RULES ---
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# Port
http_port 3128