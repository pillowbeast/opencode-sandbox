services:
  # ============================================
  # Egress Proxy (Security Gatekeeper)
  # ============================================
  secure-proxy:
    image: ubuntu/squid:latest
    container_name: ${PROJECT_NAME:-agent}-proxy
    volumes:
      - ./squid.conf:/etc/squid/squid.conf
    networks:
      - sandbox-net

  # ============================================
  # Main OpenCode Sandbox
  # ============================================
  ai-agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ${PROJECT_NAME:-agent}-sandbox

    # CONNECTIVITY: Connect to internal network only
    networks:
      - sandbox-net

    # ROUTING: Force traffic through the proxy
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-AI Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-ai-agent@local.dev}
      # Proxy Configuration
      - http_proxy=http://secure-proxy:3128
      - https_proxy=http://secure-proxy:3128
      - HTTP_PROXY=http://secure-proxy:3128
      - HTTPS_PROXY=http://secure-proxy:3128
      # Bypass proxy for local connections (crucial for MCPs talking to localhost)
      - no_proxy=localhost,127.0.0.1,secure-proxy

    volumes:
      - ./:/workspace/project
      # Credential masking
      - /dev/null:/workspace/project/.env
      - /dev/null:/workspace/project/.git/config
      - ./.git:/workspace/project/.git
      - /workspace/project/node_modules
      # OpenCode CLI & Configuration
      - ${OPENCODE_CLI_PATH:-~/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ~/.config/opencode:/home/ai-agent/.config/opencode:ro
      - ~/.local/share/opencode/auth.json:/home/ai-agent/.local/share/opencode/auth.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    user: ai-agent
    working_dir: /workspace/project
    command: ["/bin/bash"]
    tty: true
    stdin_open: true
    depends_on:
      - secure-proxy
    shm_size: "2gb"
    init: true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 2G

# ============================================
# Networks
# ============================================
networks:
  sandbox-net:
    driver: bridge
    internal: false
